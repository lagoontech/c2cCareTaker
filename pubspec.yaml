name: care2caretaker
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.3+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get:
  intl: ^0.19.0
  flutter_screenutil:
  google_fonts:
  flutter_spinkit:
  flutter_svg:
  auto_size_text:
  country_code_picker: ^3.0.0
  pin_code_fields: ^8.0.1
  iconly:
  enefty_icons:
  multi_dropdown:
  awesome_bottom_bar:
  custom_rating_bar:
  readmore:
  easy_date_timeline: ^1.1.3
  lottie:
  dotted_border:
  table_calendar: ^3.1.2
  shared_preferences: ^2.5.3
  fluttertoast: ^9.0.0
  geolocator:
  geocoding:
  firebase_core:
  firebase_auth:
  google_sign_in: ^7.2.0
  firebase_messaging:
  onscreen_num_keyboard: ^1.0.4
  image_picker: ^1.2.0
  cached_network_image:
  shimmer:
  file_picker: ^10.3.3
  open_filex: ^4.7.0
  dio:
  path_provider: ^2.1.5
  flutter_pdfview:
  firebase_analytics:
  flutter_local_notifications:
  url_launcher: ^6.3.2
  awesome_dialog:
  dropdown_button2: ^2.3.9
  animated_refresh: ^1.0.0
  animated_custom_dropdown: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/svg/launcher_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/svg/
    - assets/icons/
    - assets/images/payment/
    - assets/lottie/
